name: "🤝 Suggest an Ecosystem Listing"
description: "Tell us about a tool or organization that extends or supports the FinOps toolkit so we can feature it."
labels:
  - "Needs: Triage 🔍"
  - "Type: Docs 📖"
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for helping the ecosystem grow! 🙌
        The [FinOps toolkit ecosystem](https://microsoft.github.io/finops-toolkit/ecosystem) page features independent tools that extend the toolkit and organizations that offer paid implementation, training, advisory, or managed services for it.

        We're looking for a website that clearly shows work with the FinOps toolkit, FinOps hubs, Power BI reports, or related toolkit components specifically – not just FinOps or Azure cost management in general. We'll take a look and follow up here if we have questions.

        FinOps toolkit contributors and maintainers are welcome to suggest their own tools or organizations too.

        Listings are informational only. They don't imply Microsoft endorsement, certification, or partnership, and entries are added alphabetically, with no ranking or featured placement.

  - type: input
    id: name
    attributes:
      label: "Name"
      placeholder: "Enter the tool or organization's name"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: "Website"
      placeholder: "https://example.com"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "What does it do?"
      description: "Briefly describe the tool's capabilities, or the services offered (for example, implementation, training, advisory, customization, or managed services)."
      placeholder: "Describe the tool or services"
    validations:
      required: true
