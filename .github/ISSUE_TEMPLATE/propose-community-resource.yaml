name: "🤝 Suggest a Community Implementation Resource"
description: "Tell us about an organization offering paid FinOps toolkit services so we can feature them."
labels:
  - "Needs: Triage 🔍"
  - "Type: Docs 📖"
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for helping the community grow! 🙌
        The [community implementation resources](https://microsoft.github.io/finops-toolkit/community-resources) page features independent organizations that offer paid implementation, training, advisory, or managed services for the FinOps toolkit.

        To be featured, we just need public evidence that the organization specifically supports the FinOps toolkit, FinOps hubs, Power BI reports, or related toolkit components – not just FinOps or Azure cost management in general.

        Listings are informational only. They don't imply Microsoft endorsement, certification, or partnership, and entries are added alphabetically with no ranking or featured placement.

  - type: input
    id: organization_name
    attributes:
      label: "Organization name"
      placeholder: "Enter the organization's name"
    validations:
      required: true

  - type: input
    id: organization_url
    attributes:
      label: "Organization website"
      placeholder: "https://example.com"
    validations:
      required: true

  - type: textarea
    id: services
    attributes:
      label: "Services offered"
      description: "Briefly describe the paid services offered (for example, implementation, training, advisory, customization, or managed services)."
      placeholder: "Describe the services"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: "Public evidence of FinOps toolkit support"
      description: "Link to public evidence that the organization specifically supports the FinOps toolkit, FinOps hubs, Power BI reports, or related toolkit components (for example, a case study, blog post, or documentation page)."
      placeholder: "Provide links"
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: "Contact"
      description: "Your name and relationship to the organization."
      placeholder: "Enter your name and role"
    validations:
      required: true
