<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinOps hub — local dashboard</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="title-block">
        <h1>FinOps hub <span class="muted">·</span> local</h1>
        <p class="sub" id="source-line">Connecting to the Kusto emulator…</p>
      </div>
      <div class="controls">
        <div class="seg" id="preset" role="group" aria-label="Time range">
          <button data-preset="3m">3M</button>
          <button data-preset="6m">6M</button>
          <button data-preset="12m">12M</button>
          <button data-preset="all" class="active">All</button>
        </div>
        <button id="refresh" class="btn" title="Re-run queries">↻ Refresh</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Dashboard views">
      <button data-tab="overview" class="active" role="tab" aria-selected="true" aria-controls="content">Cost overview</button>
      <button data-tab="allocation" role="tab" aria-selected="false" aria-controls="content">Allocation</button>
      <button data-tab="rate" role="tab" aria-selected="false" aria-controls="content">Rate optimization</button>
      <button data-tab="usage" role="tab" aria-selected="false" aria-controls="content">Usage &amp; unit economics</button>
      <button data-tab="anomaly" role="tab" aria-selected="false" aria-controls="content">Anomalies &amp; forecast</button>
      <button data-tab="tokenomics" role="tab" aria-selected="false" aria-controls="content">Tokenomics</button>
    </nav>

    <div id="filter-bar" class="filter-bar" hidden aria-label="Active filters" role="region">
      <span class="filter-label">Filtered by</span>
      <div id="filter-chips" class="filter-chips"></div>
      <button id="filter-reset" class="filter-reset" type="button" aria-label="Clear all filters">Reset all</button>
    </div>

    <main id="content" role="tabpanel" aria-label="Dashboard content">
      <div class="loading" id="loading">Loading cost data…</div>
    </main>

    <div id="diagnostic-rail" class="diagnostic-rail" aria-label="Query diagnostic information"></div>

    <footer class="app-footer">
      <span id="footer-meta"></span>
      <span class="muted">Grounded in the FinOps Framework domains &amp; the FinOps toolkit query catalog.</span>
    </footer>

    <dialog id="kql-dialog" aria-modal="true" aria-label="KQL query">
      <div class="kql-dialog-inner">
        <div class="kql-dialog-header">
          <h3>KQL query</h3>
          <button id="kql-close" class="btn" type="button" aria-label="Close dialog">✕</button>
        </div>
        <textarea id="kql-text" rows="14" spellcheck="false" autocomplete="off" aria-label="KQL query text"></textarea>
        <p id="kql-error" class="kql-dialog-error" role="alert"></p>
        <div class="kql-dialog-footer">
          <button id="kql-copy" class="btn" type="button">Copy</button>
          <button id="kql-run" class="btn btn-primary" type="button">Run</button>
        </div>
      </div>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
