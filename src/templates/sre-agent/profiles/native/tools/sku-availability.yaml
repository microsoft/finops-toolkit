api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: sku-availability
spec:
  type: PythonFunctionTool
  connector: ''
  toolMode: Auto
  description: |-
    Lists regional Azure Compute SKU availability, including available zones
    and SKU availability restrictions with reason codes. Repeat with
    pagination.next_offset until it is null to retrieve all matching SKUs.
  functionCode: |-
    def main(**kwargs):
        import json
        import requests

        ARM_ENDPOINT = "https://management.azure.com"
        ARM_SCOPE = "https://management.azure.com/.default"
        COMPUTE_API_VERSION = "2021-07-01"

        subscription_id = kwargs.get("subscription_id")
        location = kwargs.get("location")
        sku_filter = kwargs.get("sku_filter")
        resource_provider = "compute"

        result = {
            "subscription_id": subscription_id,
            "location": location,
            "sku_filter": sku_filter,
            "resource_provider": resource_provider,
            "unrestricted_skus": [],
            "restricted_skus": [],
        }

        if not subscription_id:
            result["error"] = "subscription_id is required"
            return result

        if not location:
            result["error"] = "location is required"
            return result

        normalized_filter = str(sku_filter).strip().lower() if sku_filter else None

        try:
            from azure.identity import DefaultAzureCredential
            credential = DefaultAzureCredential()
            token = credential.get_token(ARM_SCOPE).token
            headers = {
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json",
            }
        except Exception as exc:
            result["error"] = f"Failed to initialize Azure ARM credential: {exc}"
            return result

        try:
            url = f"{ARM_ENDPOINT}/subscriptions/{subscription_id}/providers/Microsoft.Compute/skus"
            resource_skus = []
            params = {
                "api-version": COMPUTE_API_VERSION,
                "$filter": f"location eq '{location}'",
            }
            while url:
                response = requests.get(
                    url,
                    headers=headers,
                    params=params,
                    timeout=120,
                )
                response.raise_for_status()
                payload = response.json()
                resource_skus.extend(payload.get("value", []))
                url = payload.get("nextLink")
                params = None

            for sku in resource_skus:
                name = sku.get("name")
                if normalized_filter and normalized_filter not in str(name or "").lower():
                    continue

                restrictions = []
                for restriction in sku.get("restrictions") or []:
                    reason_code = restriction.get("reasonCode", restriction.get("reason_code"))
                    restriction_item = {
                        "type": restriction.get("type"),
                        "values": list(restriction.get("values") or []),
                        "reason_code": reason_code,
                    }

                    restriction_info = restriction.get("restrictionInfo") or restriction.get("restriction_info")
                    if restriction_info:
                        restriction_item["restriction_info"] = {
                            "locations": list(restriction_info.get("locations") or []),
                            "zones": list(restriction_info.get("zones") or []),
                        }

                    restrictions.append(restriction_item)

                zones = set()
                for location_info in sku.get("locationInfo", sku.get("location_info", [])) or []:
                    info_location = location_info.get("location")
                    if not info_location or str(info_location).lower() == str(location).lower():
                        zones.update(str(zone) for zone in (location_info.get("zones") or []))

                capabilities = {entry.get("name"): entry.get("value") for entry in sku.get("capabilities", [])}
                row = {"sku": name, "vcpus": capabilities.get("vCPUs"),
                       "gpus": capabilities.get("GPUs"), "zones": ",".join(sorted(zones)),
                       "restricted": bool(restrictions)}
                if restrictions:
                    row["reason"] = ",".join(sorted({str(r.get("reason_code") or r.get("type") or "unknown") for r in restrictions}))
                result["restricted_skus" if restrictions else "unrestricted_skus"].append(row)

            unrestricted_count = len(result["unrestricted_skus"])
            restricted_count = len(result["restricted_skus"])
            result["summary"] = {
                "total_matching_skus": unrestricted_count + restricted_count,
                "unrestricted_count": unrestricted_count,
                "restricted_count": restricted_count,
            }
            all_rows = (
                [("unrestricted_skus", row) for row in result["unrestricted_skus"]]
                + [("restricted_skus", row) for row in result["restricted_skus"]]
            )
            try:
                offset = int(kwargs.get("offset") or 0)
                if offset < 0:
                    raise ValueError()
            except (TypeError, ValueError):
                result["error"] = "offset must be a nonnegative integer"
                result["unrestricted_skus"] = []
                result["restricted_skus"] = []
                return json.dumps(result, separators=(",", ":"))
            result["unrestricted_skus"] = []
            result["restricted_skus"] = []
            result["pagination"] = {"offset": offset, "next_offset": None}
            for index in range(offset, len(all_rows)):
                category, row = all_rows[index]
                result[category].append(row)
                result["pagination"]["next_offset"] = index + 1 if index + 1 < len(all_rows) else None
                if len(json.dumps(result, separators=(",", ":"))) > 880:
                    result[category].pop()
                    result["pagination"]["next_offset"] = index
                    if index == offset:
                        result["error"] = "A single SKU exceeds the output limit; narrow sku_filter."
                    break

        except Exception as exc:
            result["error"] = f"Failed to list Azure {resource_provider} resource SKUs: {exc}"

        return json.dumps(result, separators=(",", ":"))
  timeoutSeconds: 240
  dependencies:
    - azure-identity
    - requests
  authScopes:
    - ARM
  parameters:
    - name: subscription_id
      type: string
      description: Azure subscription ID to query for regional SKU availability.
      required: true
    - name: location
      type: string
      description: Azure region to query for SKU availability and restrictions.
      required: true
    - name: sku_filter
      type: string
      description: |-
        Optional case-insensitive SKU name substring filter.
      required: false
    - name: offset
      type: integer
      description: Optional continuation offset from the previous result's pagination.next_offset.
      required: false
