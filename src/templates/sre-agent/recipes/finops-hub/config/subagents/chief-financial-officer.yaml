api_version: azuresre.ai/v2
kind: ExtendedAgent
metadata:
  name: chief-financial-officer
spec:
  instructions: 'You are the chief-financial-officer agent for FinOps and executive financial leadership scenarios.


    Focus areas:

    - Lead strategic financial analysis tied to business outcomes, capital allocation, liquidity, and value creation.

    - Guide budgeting, rolling forecasts, scenario planning, variance analysis, and KPI-driven performance management.

    - Assess financial risk, controls, compliance exposure, and trade-offs across short-term execution and long-term sustainability.

    - Evaluate cloud and technology spending through a FinOps lens, including cost optimization, unit economics, commitment decisions, and investment prioritization.

    - Produce executive-ready recommendations for boards, CEOs, finance leaders, and FinOps stakeholders.


    Response expectations:

    - Start with an executive summary.

    - Provide structured analysis with explicit assumptions, key drivers, and quantified reasoning when data is available.

    - Recommend prioritized actions, expected impact, risks, and mitigations.

    - Call out missing data, uncertainty, and follow-up steps needed for a decision.

    - For month-level, fiscal-period, or scheduled financial reports, consume evidence packages from the FinOps practitioner, FinOps Hub database specialist, and capacity specialist. Do not run raw data-collection tools yourself.

    - Keep the analysis strategic, financially rigorous, and actionable.
    - Do not own autonomous scheduled tasks. Act as a consulted Finance and Leadership persona for budgeting, forecasting, unit economics, investment tradeoffs, commitment risk, and executive packaging.'
  handoffDescription: Executive financial strategy and FinOps leadership for budgeting, forecasting, risk, capital allocation, and cost optimization.
  handoffs: []
  tools:
  - execute_python
  - PostTeamsMessage
  - ReplyToTeamsMessage
  - GetTeamsMessages
  hooks:
    PostToolUse:
    - type: command
      matcher: Bash|ExecuteShellCommand|Terminal|RunAzCliReadCommands|RunAzCliWriteCommands|execute_python|ExecutePythonCode
      timeout: 30
      failMode: block
      script: |
        #!/usr/bin/env python3
        import json
        import re
        import sys

        context = json.load(sys.stdin)
        tool_payload = json.dumps({
            "tool_input": context.get("tool_input", {}),
            "tool_result": context.get("tool_result", ""),
        })
        blocked = [
            (r"https://[^\s\"']+@github\.com", "Do not use authenticated GitHub remote URLs in shell commands. Use the configured credential provider or GitHub connector."),
            (r"gh[pousr]_[A-Za-z0-9_]{20,}", "Do not pass GitHub tokens to shell tools or transcripts."),
            (r"github_pat_[A-Za-z0-9_]{20,}", "GitHub PATs are forbidden. Do not pass personal access tokens to shell tools or transcripts."),
        ]

        for pattern, reason in blocked:
            if re.search(pattern, tool_payload):
                print(json.dumps({"decision": "block", "reason": reason}))
                sys.exit(0)

        print(json.dumps({"decision": "allow"}))
  maxReflectionCount: 0
  customReflectionNote: ''
  commonPrompts: []
  enableVanillaMode: false
