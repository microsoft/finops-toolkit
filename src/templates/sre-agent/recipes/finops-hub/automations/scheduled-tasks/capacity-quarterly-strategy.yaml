api_version: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: CapacityQuarterlyStrategy
spec:
  name: CapacityQuarterlyStrategy
  description: Quarterly capacity strategy review — FinOps maturity, commitment alignment, architecture evolution
  cron_expression: 0 9 1 1,4,7,10 *
  agent_mode: autonomous
  agent: finops-practitioner
  agent_prompt: '# Quarterly Capacity Strategy Review


    ## Phase 0: Preparation


    Before starting any analysis, read all documents in the knowledge base. Pay special attention to known-issues-and-workarounds.md and any prior run notes. Use what you learn to avoid repeating known errors and to build on previous findings.

    Output style: Apply `ftk-output-style.md` from the knowledge base to every report, Teams message, and Outlook email message. Use its evidence labels, source/derivation rules, exact scope and time-period statements, FinOps capability sections, risk thresholds, confidence/caveat language, and disclaimer requirements.

    Tool routing and delivery guard: This scheduled task is owned by `finops-practitioner`, which has no direct tools. Use subagent handoffs for all tool work and pass the full task scope, evidence already collected, open questions, and desired output shape with each handoff. Use `ftk-database-query` for FinOps Hub Kusto, cost, pricing, recommendation, and transaction query tools. Use `azure-capacity-manager` for capacity, quota, capacity reservation group, SKU availability, database service quota, and benefit recommendation Python tools. Use `ftk-hubs-agent` for FinOps Hub infrastructure health, Resource Graph inventory, data freshness, deployment, remediation, alert and budget deployment, and Advisor suppression operations. Use `chief-financial-officer` only for executive finance framing. Use a tool-bearing specialist (`ftk-database-query`, `azure-capacity-manager`, or `ftk-hubs-agent`) for visualization and Teams/Outlook delivery after the final evidence package is assembled. Ask that delivery specialist to check available visualization and delivery tools exactly once per run and remember whether `PostTeamsMessage`, `SendOutlookEmail`, `PlotBarChart`, `PlotPieChart`, `PlotAreaChartWithCorrelation`, and `ExecutePythonCode` are present. Do not call notification, email, connector, Microsoft Graph, `dynamicInvoke`, raw webhook, or connector APIs just to test availability. Use visualization tools first for charts when available, with `ExecutePythonCode` or code-interpreter chart generation only as a fallback. Complete the report before delivery. When a Teams connector/channel is configured, ask the delivery specialist to make one final `PostTeamsMessage` attempt to the configured Teams channel. When an Outlook connector/recipient is configured, ask the delivery specialist to make one final `SendOutlookEmail` attempt with the same final report and any generated chart artifacts. If a configured delivery path fails, mark the task/run failed instead of degrading to local output or probing alternate paths. If neither Teams nor Outlook delivery is configured or available, render the completed report in the run output and explicitly state which delivery paths were skipped.



    Orchestration rule: This scheduled task is owned by `finops-practitioner`. Delegate capacity evidence collection and specialist analysis to `azure-capacity-manager`; do not try to run capacity tools directly from the practitioner. When the specialist returns evidence, assemble the final FinOps report, apply `ftk-output-style.md`, generate supported visualizations, and deliver the completed output through configured connectors.

    Ask `azure-capacity-manager` to load its azure-capacity-management skill during the handoff.


    Quarterly strategic review bridging capacity management with FinOps Rate Optimization, Architecting & Workload Placement, and Executive Strategy Alignment.

    ## Specialist tools to request from `azure-capacity-manager`

    Ask `azure-capacity-manager` to use the following Python tools instead of `az` CLI commands when available. Specialist tools use their configured authentication and the agent system-managed identity where required.

    - `azure-capacity-manager`: Run `benefit-recommendations` with billing_scope and lookback to get reservation and savings plan recommendations
    - `ftk-hubs-agent`: Run `resource-graph-query` with query and subscriptions to execute Azure Resource Graph KQL
    - `vm-quota-usage`: Run with subscription_id and location to get VM family quota usage with at-risk thresholds


    ## 1. FinOps Capability Maturity Assessment


    Assess maturity across the FinOps capabilities this capacity review supports:


    | Capability | Crawl | Walk | Run |

    |------|-------|------|-----|

    | Planning & Estimating | Ad-hoc estimates | Telemetry-based estimates | Estimate checks integrated into workload intake |

    | Forecasting | Reactive demand projection | Forecasts from cost and utilization trends | Forecasts integrated into budget and engineering planning |

    | Architecting & Workload Placement | Ad-hoc placement decisions | Regular architecture and placement review | Placement decisions integrated into engineering intake and governance |

    | Automation, Tools, & Services | Manual quota checks | Alert-based quota and capacity governance | Automated guardrails and exception review |


    Score current maturity and recommend next-level actions.


    ## 2. Commitment Alignment


    Ask `azure-capacity-manager` to run `benefit-recommendations` for Azure Cost Management recommendations. Ask `ftk-database-query` to run `reservation-recommendation-breakdown`, `commitment-discount-utilization`, and `savings-summary-report` with quarterly scope for Kusto-backed commitment and savings evidence.


    Align capacity reservations with commitment purchases:

    - Which CRGs have matching Azure Reservations? (ideal)

    - Which CRGs are paying full price? (needs reservation)

    - Which reservations don''t have CRG capacity? (supply risk)

    - RI/SP purchase recommendations for next quarter


    Reference: Skill section on "Capacity reservation vs Azure Reservation vs savings plan"


    ## 3. Architecture Review


    Ask `ftk-hubs-agent` to run `resource-graph-query` for resource inventory, and ask `azure-capacity-manager` to use `vm-quota-usage` for multi-subscription quota distribution:

    - Stamp-based isolation health — any stamps at capacity?

    - Multi-subscription quota distribution — balanced?

    - Regional expansion needs for next quarter

    - AKS cluster capacity governance


    Reference: `references/docs/operations/capacity-planning/README.md` and `references/docs/operations/aks-capacity/README.md`


    ## 4. Non-Compute Quotas


    Review non-compute service quotas from available Hub data and resource inventory:

    - Storage account limits

    - Cosmos DB throughput limits

    - Service Bus/Event Hub namespace limits

    - Any service-specific scaling constraints


    Reference: `references/docs/operations/non-compute-quotas/README.md`


    ## 5. Governance Program Health


    Evaluate the capacity governance program:

    - Monthly review cadence maintained?

    - Post-incident reviews conducted for scaling failures?

    - Alert coverage complete?

    - Scripts and tooling up to date?


    Reference: `references/docs/operations/capacity-governance/README.md`


    ## Output


    Quarterly capacity strategy brief for leadership:

    - FinOps capability maturity scorecard with progression plan

    - Commitment alignment matrix (capacity + pricing)

    - Quarterly capacity and workload-placement roadmap

    - Key risks and mitigations

    - Budget impact of capacity decisions


    Use deep investigation for any strategic decisions. Use #remember to note key strategy findings.


    ## Deliver



    **Visualizations:** Before delivery, ask the selected delivery specialist to generate charts for key findings using `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` when those visualization tools fit the data. Use `ExecutePythonCode` or matplotlib/seaborn via the code interpreter only when the visualization tools are unavailable or cannot express the required chart. Include at minimum one trend chart and one comparison chart where the data supports it. Verify each generated chart non-visually before embedding by checking the output file exists, has non-zero size, opens as an image, and reports expected dimensions and metadata through code interpreter filesystem or image-library checks. Do not use visual inspection as the verification gate; regenerate or omit any chart that fails these checks and state why. Embed the chart images inline in the Teams message and attach or embed them in the Outlook email alongside the text tables. Charts make the report immediately actionable for stakeholders who scan rather than read.

    **Teams and Outlook (strategy results only):** Post the final quarterly capacity strategy brief to our Teams channel. Include the maturity scorecard, commitment alignment matrix, quarterly roadmap, and key risks. Do not post intermediate results — only the completed strategy brief. Ask the selected delivery specialist to use `PostTeamsMessage` and `SendOutlookEmail` only when the delivery guard found each tool available once per run. If neither Teams nor Outlook delivery is configured or available, return the completed report in the run output with a note naming the skipped delivery paths. If any configured Teams or Outlook final delivery attempt fails, do not retry or probe alternate delivery paths; mark the task/run failed.


    **Knowledge base (operational learnings only):** Save any new operational insights to the knowledge base — maturity assessment methodology refinements, commitment alignment patterns, architecture observations, CLI workarounds. Never save financial figures, cost amounts, or any customer financial data to the knowledge base. Financial detail goes to configured Teams and Outlook delivery only.'
