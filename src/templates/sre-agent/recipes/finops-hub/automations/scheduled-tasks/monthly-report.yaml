api_version: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: Monthly
spec:
  name: Monthly
  description: Autonomous monthly cost analysis with core cost-analysis Kusto tools
  cron_expression: 15 17 5 * *
  agent_mode: autonomous
  agent: finops-practitioner
  agent_prompt: '# Monthly Cost Analysis


    ## Phase 0: Preparation


    Before starting any analysis, read all documents in the knowledge base. Pay special attention to known-issues-and-workarounds.md and any prior run notes. Use what you learn to avoid repeating known errors and to build on previous findings.

    Output style: Apply `ftk-output-style.md` from the knowledge base to every report, Teams message, and Outlook email message. Use its evidence labels, source/derivation rules, exact scope and time-period statements, FinOps capability sections, risk thresholds, confidence/caveat language, and disclaimer requirements.

    Tool routing and delivery guard: This scheduled task is owned by `finops-practitioner`, which has KB-only SearchMemory and no operational tools. Use subagent handoffs for all tool work and pass the full task scope, evidence already collected, open questions, and desired output shape with each handoff. Use `ftk-database-query` for FinOps Hub Kusto, cost, pricing, recommendation, and transaction query tools. Use `azure-capacity-manager` for capacity, quota, capacity reservation group, SKU availability, database service quota, and benefit recommendation Python tools. Use `ftk-hubs-agent` for FinOps Hub infrastructure health, Resource Graph inventory, data freshness, deployment, remediation, alert and budget deployment, and Advisor suppression operations. Use `chief-financial-officer` only for executive finance framing. Use a tool-bearing specialist (`ftk-database-query`, `azure-capacity-manager`, or `ftk-hubs-agent`) for visualization and Teams/Outlook delivery after the final evidence package is assembled. Ask that delivery specialist to check available visualization and delivery tools exactly once per run and remember whether `PostTeamsMessage`, `SendOutlookEmail`, `PlotBarChart`, `PlotPieChart`, `PlotAreaChartWithCorrelation`, and `ExecutePythonCode` are present. Do not call notification, email, connector, Microsoft Graph, `dynamicInvoke`, raw webhook, or connector APIs just to test availability. Use visualization tools first for charts when available, with `ExecutePythonCode` or code-interpreter chart generation only as a fallback. Complete the report before delivery. When a Teams connector/channel is configured, ask the delivery specialist to make one final `PostTeamsMessage` attempt to the configured Teams channel. When an Outlook connector/recipient is configured, ask the delivery specialist to make one final `SendOutlookEmail` attempt with the same final report and any generated chart artifacts. If a configured delivery path fails, mark the task/run failed instead of degrading to local output or probing alternate paths. If neither Teams nor Outlook delivery is configured or available, render the completed report in the run output and explicitly state which delivery paths were skipped.



    Load your finops-toolkit and azure-cost-management skills.


    Perform a comprehensive autonomous analysis for the most recently completed calendar month and a forecast for the next calendar month. If the knowledge base documents a fiscal calendar, include the fiscal mapping and state the reporting boundary explicitly. Each run builds on previous runs — prior research, notes, and results carry forward.

    ## Specialist evidence requests for this task

    Lead the workflow as the FinOps practitioner. Do not run Kusto tools directly. Ask `ftk-database-query` to collect FinOps Hub Kusto evidence and ask `azure-capacity-manager` to collect quota and capacity evidence.

    - `ftk-hubs-agent`: Run `data-freshness-check` with cluster_uri and database to check Hub data staleness
    - `azure-capacity-manager`: Run `vm-quota-usage` with subscription_id and location to get VM family quota usage with at-risk thresholds


    ## Phase 1: Data Collection


    Request these Kusto evidence packages from `ftk-database-query` in sequence. Use #remember to note operational observations (tool errors, data quality issues, query patterns) as you go — never financial figures.


    ### 1.1 Verify Connectivity

    Ask `ftk-hubs-agent` to run `data-freshness-check` with the FinOps Hub cluster URI and Hub database. Treat its direct REST `Costs()` latest data date as the authoritative freshness source and mark any conflicting stale-memory, raw-KQL, or ingestion timestamp conclusion as superseded and unsafe. Proceed if latest `Costs()` data is 3 days old or newer. Do not ask `ftk-database-query` to run `costs-enriched-base` for freshness checks or month-level reports; use aggregated Kusto tools for complete-month reporting windows and reserve row-level detail for one-day drill-downs only.


    ### 1.2 Fiscal Trends

    Ask `ftk-database-query` to run `monthly-cost-trend` with startDate=startofmonth(ago(365d)) to get 12-month billed and effective cost trends.


    ### 1.3 Service Breakdown

    Ask `ftk-database-query` to run `top-services-by-cost` with N=20, startDate=startofmonth(ago(30d)) to identify top cost-driving services. Flag commitment discount opportunities and right-sizing potential.


    ### 1.4 Resource Group Analysis

    Ask `ftk-database-query` to run `top-resource-groups-by-cost` with default parameters. Identify consolidation opportunities.


    ### 1.5 Anomaly Detection

    Ask `ftk-database-query` to run `cost-anomaly-detection` with numberOfMonths=12, interval=1d. Use deep investigation on any detected anomalies to form hypotheses about root causes.


    ### 1.6 Savings and ESR

    Ask `ftk-database-query` to run `savings-summary-report` with startDate=startofmonth(ago(30d)). Record negotiated discount savings, commitment discount savings, total savings, and Effective Savings Rate (ESR).


    ### 1.7 Commitment Utilization

    Ask `ftk-database-query` to run `commitment-discount-utilization` with startDate=startofmonth(ago(30d)). Compare utilization against the 60-70% industry benchmark.


    **Checkpoint:** Confirm fiscal trends, service breakdown, resource groups, anomalies, savings, and commitments are all collected before proceeding.


    ### 1.8 Forecast

    Ask `ftk-database-query` to run `cost-forecasting-model` with startDate=startofmonth(ago(180d)), forecastPeriods=90, interval=1d. Assess forecast confidence.


    ### 1.9 Reservation Recommendations

    Ask `ftk-database-query` to run `reservation-recommendation-breakdown` to identify top savings opportunities by break-even date and projected savings.


    ### 1.10 Regional Distribution

    Ask `ftk-database-query` to run `cost-by-region-trend` with default parameters. Identify regional optimization opportunities.


    ### 1.11 Resource Types

    Ask `ftk-database-query` to run `top-resource-types-by-cost` with N=20. Identify legacy or inefficient resource types.

    Ask `azure-capacity-manager` to run `vm-quota-usage` for subscriptions and locations with significant compute cost to identify VM family quota risks that could affect optimization or forecast assumptions.


    ### 1.12 Tag Coverage

    Ask `ftk-database-query` to run `cost-by-financial-hierarchy` with N=20, startDate=startofmonth(ago(30d)), and endDate=startofmonth(now()) to review allocation dimensions and identify missing team, product, application, or environment values. Do not run raw `costs-enriched-base` for tag-coverage rollups.


    ### 1.13 Price Benchmarking

    Ask `ftk-database-query` to run `service-price-benchmarking` with startDate=startofmonth(ago(30d)). Compare list, contracted, and effective costs. Identify negative savings anomalies. Compare variance to the 3-5% industry average
    benchmark.


    ### 1.14 Cost Volatility

    Ask `ftk-database-query` to run `cost-anomaly-detection` adapted for 90-day daily spikes. Identify peak cost dates and root causes.


    ### 1.15 Marketplace/Other Purchases

    Ask `ftk-database-query` to run `top-other-transactions` with N=20. If it returns zero rows or `ZERO_ROWS_RETURNED`, ask `ftk-hubs-agent` to run `data-freshness-check` and report whether `Transactions()` has the `TRANSACTIONS_ZERO_ROWS` diagnostic. Do not conclude there were no large one-time non-usage purchases until the export, ingestion, and stored-function diagnostic is clear.


    ### 1.16 Month-over-Month Change

    Ask `ftk-database-query` to run `monthly-cost-change-percentage` with startDate=startofmonth(ago(390d)). Track cost volatility and trend direction.


    **Checkpoint:** Confirm ALL data collection is complete before strategic analysis.


    ## Phase 2: Strategic Analysis


    ### 2.1 ROI and Business Impact

    Calculate ROI = Annual Savings / Implementation Cost for each optimization opportunity. Determine payback period. Compare against industry benchmarks (cost variance 3-5%, RI coverage 60-70%). Create
    opportunity matrix.


    ### 2.2 Quick Wins

    Filter opportunities meeting ALL criteria: implementation < 30 days AND risk = low AND savings > $1000/month. Prioritize: commitment purchases, right-sizing, auto-shutdown.


    ### 2.3 Detailed Findings

    Document 7 sections: (1) Cost Analysis, (2) Savings Analysis, (3) Optimization Opportunities, (4) Governance & Risk, (5) Strategic Market Positioning, (6) Temporal Themes, (7) Implementation Roadmap.
    No raw JSON references — executive-level language only.


    ### 2.4 Recommendations with Performance Grading

    Assign a letter grade (A+ to F) with percentile ranking. Build prioritized actions: Immediate (<30 days), Short-term (30-90 days), Long-term (90+ days). Include dollar savings amount, confidence %,
    and clear owner for each.


    ### 2.5 Implementation Roadmap

    Phase 1 (30 days): quick wins. Phase 2 (60 days): commitments. Phase 3 (90 days): architecture. Include dependencies, risks, success metrics for each phase.


    **Checkpoint:** Validate all deliverables before formatting.


    ## Phase 3: Report Formatting


    Format as a professional, scannable report. Use tables, emoji indicators (📊 💰 🚨 🎯 🏆), bold dollar amounts. Include multi-scenario forecasts (Conservative/Expected/Optimistic), YoY/MoM comparisons, and
    percentile positioning.


    Do not stop or yield until the report is complete and ready for the FinOps team.


    ## Phase 4: Deliver



    **Visualizations:** Before delivery, ask the selected delivery specialist to generate charts for key findings using `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` when those visualization tools fit the data. Use `ExecutePythonCode` or matplotlib/seaborn via the code interpreter only when the visualization tools are unavailable or cannot express the required chart. Include at minimum one trend chart and one comparison chart where the data supports it. Verify each generated chart non-visually before embedding by checking the output file exists, has non-zero size, opens as an image, and reports expected dimensions and metadata through code interpreter filesystem or image-library checks. Do not use visual inspection as the verification gate; regenerate or omit any chart that fails these checks and state why. Embed the chart images inline in the Teams message and attach or embed them in the Outlook email alongside the text tables. Charts make the report immediately actionable for stakeholders who scan rather than read.

    **Teams and Outlook (financial results only):** Post the final report to our Teams channel. Include the executive summary, key findings, grade card, and top recommendations. Do not post intermediate results — only the completed report. Ask the selected delivery specialist to use `PostTeamsMessage` and `SendOutlookEmail` only when the delivery guard found each tool available once per run. If neither Teams nor Outlook delivery is configured or available, return the completed report in the run output with a note naming the skipped delivery paths. If any configured Teams or Outlook final delivery attempt fails, do not retry or probe alternate delivery paths; mark the task/run failed.


    **Knowledge base (operational learnings only):** Save any new operational insights to the knowledge base — tool errors encountered, workarounds discovered, data quality observations, query patterns that worked or failed. Never save financial figures, cost amounts, savings numbers, or any customer financial data to the knowledge base. Financial detail goes to configured Teams and Outlook delivery only.'
