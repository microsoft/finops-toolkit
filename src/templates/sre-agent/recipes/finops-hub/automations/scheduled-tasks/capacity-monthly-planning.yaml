api_version: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: CapacityMonthlyPlanning
spec:
  name: CapacityMonthlyPlanning
  description: Monthly capacity planning cycle — demand forecast, capacity request pipeline, governance review
  cron_expression: 0 9 1 * *
  agent_mode: autonomous
  agent: azure-capacity-manager
  agent_prompt: '# Monthly Capacity Planning Cycle


    ## Phase 0: Preparation


    Before starting any analysis, read all documents in the knowledge base. Pay special attention to known-issues-and-workarounds.md and any prior run notes. Use what you learn to avoid repeating known errors and to build on previous findings.

    Output style: Apply `ftk-output-style.md` from the knowledge base to every report, Teams message, and Outlook email message. Use its evidence labels, source/derivation rules, exact scope and time-period statements, FinOps capability sections, risk thresholds, confidence/caveat language, and disclaimer requirements.

    Delivery and rendering guard: Check the available tools exactly once per run and remember whether `PostTeamsMessage`, `SendOutlookEmail`, `PlotBarChart`, `PlotPieChart`, `PlotAreaChartWithCorrelation`, and `ExecutePythonCode` are present. Do not call notification, email, connector, Microsoft Graph, `dynamicInvoke`, raw webhook, or connector APIs just to test availability. Use visualization tools first for charts when available, with `ExecutePythonCode` or code-interpreter chart generation only as a fallback. Complete the report before delivery. When a Teams connector/channel is configured, make one final `PostTeamsMessage` attempt to the configured Teams channel. When an Outlook connector/recipient is configured, make one final `SendOutlookEmail` attempt with the same final report and any generated chart artifacts. If a configured delivery path fails, mark the task/run failed instead of degrading to local output or probing alternate paths. If neither Teams nor Outlook delivery is configured or available, render the completed report in the run output and explicitly state which delivery paths were skipped.



    Load your azure-capacity-management skill.


    Monthly planning maps Azure capacity signals into FinOps Planning & Estimating, Forecasting, Architecting & Workload Placement, Usage Optimization, Rate Optimization support, Budgeting support, and Governance, Policy & Risk.

    ## Python tools available for this task

    The following Python tools provide real Azure data via ARM REST API. Always use these instead of `az` CLI commands when available. Python tools use DefaultAzureCredential with the agent system-managed identity.

    - `vm-quota-usage`: Run with subscription_id and location to get VM family quota usage with at-risk thresholds
    - `capacity-reservation-groups`: Run with subscription_id and resource_group when scoped to list CRGs with instanceView utilization
    - `benefit-recommendations`: Run with billing_scope and lookback to get reservation and savings plan recommendations
    - `resource-graph-query`: Run with query and subscriptions to execute Azure Resource Graph KQL


    ## 1. Demand Forecast


    Ask `ftk-database-query` to run `cost-forecasting-model` Kusto tool with 180-day historical, 90-day forecast.

    Filter to compute services. Project:

    - VM core demand by family for next 3 months

    - Growth rate by region

    - Seasonal patterns (if detectable)


    Cross-reference with business targets:

    - New customer deployments planned?

    - Stamp scale-out events expected?


    Reference: `references/docs/operations/capacity-planning/README.md`


    ## 2. Capacity Request Pipeline


    Based on the demand forecast, use `vm-quota-usage` and build a capacity request pipeline:

    - Quota increases needed (by subscription, region, family)

    - Region access requests needed

    - Zonal enablement requests needed

    - Quota group limit increases needed

    - Estimated lead times for each request type


    Reference: `references/docs/operations/quota/README.md` and capacity request guidance in the uploaded knowledge.


    ## 3. Allocation Review


    Use `capacity-reservation-groups` to review current CRG portfolio:

    - Utilization trends over the past month (from daily checks)

    - Rightsizing recommendations (reduce or increase reservations)

    - New CRGs needed based on demand forecast

    - CRG sharing opportunities across subscriptions

    - Overallocation policy review


    Reference: `references/docs/operations/capacity-reservations/README.md`


    ## 4. Cost Impact


    Run `benefit-recommendations` directly, then ask `ftk-database-query` to run `commitment-discount-utilization` and `savings-summary-report` for Kusto-backed rate-optimization evidence.

    Calculate:

    - Monthly cost of unused CRG capacity

    - Savings from Azure Reservations paired with CRGs

    - Potential savings from new commitment purchases aligned with capacity needs

    - ESR impact of capacity decisions


    ## 5. Governance Review


    Check adherence to the governance program. Use `resource-graph-query` for subscription, alert, budget, and governance inventory where ARM resource data is needed:

    - Are all subscriptions in quota groups?

    - Are anomaly alerts deployed across all subscriptions?

    - Are budget alerts configured?

    - Any post-incident reviews needed from scaling failures?


    Reference: `references/docs/operations/capacity-governance/README.md` and `references/docs/operations/monitoring-alerting/README.md`


    ## Output


    Produce a monthly capacity planning report:

    - Demand forecast table (VM family × region × month)

    - Capacity request pipeline with status and lead times

    - CRG portfolio review with cost impact

    - Governance compliance scorecard

    - Recommended actions with owners and deadlines


    Use deep investigation for any critical capacity gaps. Use #remember to note key capacity findings.


    ## Deliver



    **Visualizations:** Before delivery, generate charts for key findings using `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` when those visualization tools fit the data. Use `ExecutePythonCode` or matplotlib/seaborn via the code interpreter only when the visualization tools are unavailable or cannot express the required chart. Include at minimum one trend chart and one comparison chart where the data supports it. Verify each generated chart non-visually before embedding by checking the output file exists, has non-zero size, opens as an image, and reports expected dimensions and metadata through code interpreter filesystem or image-library checks. Do not use visual inspection as the verification gate; regenerate or omit any chart that fails these checks and state why. Embed the chart images inline in the Teams message and attach or embed them in the Outlook email alongside the text tables. Charts make the report immediately actionable for stakeholders who scan rather than read.

    **Teams and Outlook (capacity results only):** Post the final monthly capacity planning report to our Teams channel. Include the demand forecast, capacity request pipeline, CRG portfolio review, governance scorecard, and recommended actions. Do not post intermediate results — only the completed report. Use `PostTeamsMessage` and `SendOutlookEmail` only when the delivery guard found each tool available once per run. If neither Teams nor Outlook delivery is configured or available, return the completed report in the run output with a note naming the skipped delivery paths. If any configured Teams or Outlook final delivery attempt fails, do not retry or probe alternate delivery paths; mark the task/run failed.


    **Knowledge base (operational learnings only):** Save any new operational insights to the knowledge base — forecasting model accuracy, capacity request lead time observations, governance gaps discovered, CLI workarounds. Never save financial figures, cost amounts, or any customer financial data to the knowledge base. Financial detail goes to configured Teams and Outlook delivery only.'
