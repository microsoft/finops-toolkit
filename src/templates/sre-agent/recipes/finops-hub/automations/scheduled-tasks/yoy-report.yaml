api_version: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: YOY
spec:
  name: YOY
  description: Semiannual year-over-year financial analysis for January and July close checkpoints
  cron_expression: 0 9 5 1,7 *
  agent_mode: autonomous
  agent: chief-financial-officer
  agent_prompt: '# Year-over-Year Financial Analysis


    ## Phase 0: Preparation


    Before starting any analysis, read all documents in the knowledge base. Pay special attention to known-issues-and-workarounds.md and any prior run notes. Use what you learn to avoid repeating known errors and to build on previous findings.

    Teams delivery guard: Check the available tools exactly once per run and remember whether `PostTeamsMessage` is present. Do not call `PostTeamsMessage`, Microsoft Graph, `dynamicInvoke`, raw webhooks, or connector APIs just to test availability. If no Teams connector/channel is configured and this once-per-run check does not find `PostTeamsMessage`, finish the report in the run output and do not retry or probe alternate delivery paths. When a Teams connector/channel is configured, Teams delivery is mandatory: complete the analysis, make one final delivery attempt through `PostTeamsMessage` to the configured Teams channel, and if configured Teams delivery fails, mark the task/run failed instead of degrading to local output or alternate delivery.



    Load your finops-toolkit and azure-cost-management skills.


    Our fiscal year runs July through June. This task runs on January 5 and July 5. On January 5, compare the completed July-December first-half period against the same period in the prior fiscal year and forecast through June 30. On July 5, compare the just-completed July-June fiscal year against the previous fiscal year and prepare the next fiscal year planning view.

    ## Python tools available for this task

    The following Python tools provide real Azure data via ARM REST API. Always use these instead of `az` CLI commands when available. Pass `client_id` as a parameter to each tool for UAMI authentication.

    - `benefit-recommendations`: Run with billing_scope and lookback to get reservation and savings plan recommendations
    - `data-freshness-check`: Run with cluster_uri and database to check Hub data freshness
    - `resource-graph-query`: Run with query and subscriptions to execute Azure Resource Graph KQL


    ## Phase 1: Data Collection


    ### 1.1 Verify Connectivity

    Run `data-freshness-check` with the FinOps Hub cluster URI and Hub database. Treat its direct REST `Costs()` latest data date as the authoritative freshness source and mark any conflicting stale-memory, raw-KQL, or ingestion timestamp conclusion as superseded and unsafe. Proceed if latest `Costs()` data is 3 days old or newer. Do not run `costs-enriched-base` for freshness checks or fiscal-period reports; use aggregated Kusto tools for complete-month reporting windows and reserve row-level detail for one-day drill-downs only.


    ### 1.2 Year-over-year trends

    Run `monthly-cost-trend` with startDate set to the start of the prior comparison period. Get month-by-month billed and effective cost for the current comparison period and the same prior-year period.


    ### 1.3 Service Portfolio Analysis

    Run `top-services-by-cost` with N=20 for the current comparison period and the prior-year comparison period. Identify the top services driving year-over-year spend changes.


    ### 1.4 Quarterly Resource Group Trends

    Run `quarterly-cost-by-resource-group` with N=10, covering the current and prior-year comparison periods. Identify quarterly growth patterns and material resource-group shifts.


    ### 1.5 Fiscal Year Anomalies

    Run `cost-anomaly-detection` across the current and prior-year comparison periods. Use deep investigation on any significant anomalies or year-over-year discontinuities.


    ### 1.6 Savings Realization

    Run `savings-summary-report` for the current and prior-year comparison periods. Calculate ESR, total savings, and year-over-year savings movement.


    ### 1.7 Commitment Performance

    Run `commitment-discount-utilization` for the current and prior-year comparison periods. Assess how commitment purchases changed year over year.


    ### 1.8 Financial Hierarchy

    Run `cost-by-financial-hierarchy` with N=10 for the current and prior-year comparison periods. Understand cost allocation across billing profiles, teams, and applications.


    **Checkpoint:** Confirm year-over-year comparison data collection is complete.


    ### 1.9 Forecast

    Run `cost-forecasting-model` using the current comparison period as actuals and enough historical data to project the next fiscal checkpoint. For January runs, forecast through June 30. For July runs, forecast the next fiscal year planning baseline.


    ### 1.10 Reservation Recommendations

    Run `benefit-recommendations` and `reservation-recommendation-breakdown`. Identify commitments that could save money before fiscal year end.


    ### 1.11 Regional Analysis

    Run `cost-by-region-trend` for the current and prior-year comparison periods. Identify regional cost shifts.


    ### 1.12 Resource Type Efficiency

    Run `resource-graph-query` for current Azure resource inventory, then run `top-resource-types-by-cost` with N=20 for the current and prior-year comparison periods. Track resource type evolution.


    ### 1.13 Price Benchmarking

    Run `service-price-benchmarking` for the current and prior-year comparison periods. Benchmark pricing effectiveness year over year.


    ### 1.14 Month-over-Month Volatility

    Run `monthly-cost-change-percentage` covering both comparison periods. Identify the most volatile months and distinguish month-over-month volatility from true year-over-year movement.


    ### 1.15 Commitment Transactions

    Run `top-commitment-transactions` with N=20 for the current and prior-year comparison periods. Track major RI/SP purchases. If it returns zero rows or `ZERO_ROWS_RETURNED`, immediately run `data-freshness-check` and report whether `Transactions()` has the `TRANSACTIONS_ZERO_ROWS` diagnostic. Do not conclude there were no commitment purchases until the export, ingestion, and stored-function diagnostic is clear.


    ### 1.16 Other Transactions

    Run `top-other-transactions` with N=20 for the current and prior-year comparison periods. If it returns zero rows or `ZERO_ROWS_RETURNED`, immediately run `data-freshness-check` and report whether `Transactions()` has the `TRANSACTIONS_ZERO_ROWS` diagnostic. Do not conclude there were no non-usage spend patterns until the export, ingestion, and stored-function diagnostic is clear.


    **Checkpoint:** ALL data collected. Proceed to strategic analysis.


    ## Phase 2: Strategic Analysis


    ### 2.1 Year-over-year scorecard

    Grade year-over-year performance (A+ to F) across: cost management, savings realization, commitment coverage, tag compliance, forecast accuracy, and forecast risk.


    ### 2.2 Forecast

    For January runs, project total fiscal year spend with Conservative/Expected/Optimistic scenarios and compare to annual budget. For July runs, create the next fiscal year planning baseline.


    ### 2.3 Savings opportunities

    Identify quick-win optimization opportunities that can reduce costs before the next fiscal checkpoint. Prioritize by days remaining and implementation effort.


    ### 2.4 Fiscal planning

    Based on year-over-year trends, recommend budget changes, commitment purchase strategy, and optimization roadmap.


    ### 2.5 Detailed Findings

    7 sections: Cost Analysis, Savings Analysis, Optimization, Governance, Market Positioning, Temporal Themes, Implementation Roadmap.


    ### 2.6 Recommendations

    Prioritized actions: before the next fiscal checkpoint, next half-year, and next full fiscal year. Dollar amounts and owners for each.


    ## Phase 3: Report


    Professional executive report with tables, charts, emoji indicators. Include year-over-year variance, fiscal timeline, forecast scenarios, grade card, and planning recommendations.


    Do not stop or yield until the report is complete and ready for the FinOps team.


    ## Phase 4: Deliver



    **Visualizations:** Before posting, generate charts for key findings using matplotlib or seaborn via the code interpreter. Include at minimum one trend chart and one comparison chart where the data supports it. Verify each generated chart non-visually before embedding by checking the output file exists, has non-zero size, opens as an image, and reports expected dimensions and metadata through code interpreter filesystem or image-library checks. Do not use visual inspection as the verification gate; regenerate or omit any chart that fails these checks and state why. Embed the chart images inline in the Teams message alongside the text tables. Charts make the report immediately actionable for stakeholders who scan rather than read.

    **Teams (financial results only):** Post the final report to our Teams channel. Include the year-over-year scorecard, forecast scenarios, and planning recommendations. Do not post intermediate results — only the completed report. Use `PostTeamsMessage` only when the Teams delivery guard found it available once per run. If no Teams connector/channel is configured or `PostTeamsMessage` was not found during the once-per-run guard check, return the completed report in the run output with a note that Teams delivery was skipped. If a Teams connector/channel is configured and the single final `PostTeamsMessage` attempt fails, do not retry or probe alternate delivery paths; mark the task/run failed.


    **Knowledge base (operational learnings only):** Save any new operational insights to the knowledge base — tool errors encountered, workarounds discovered, data quality observations, query patterns that worked or failed. Never save financial figures, cost amounts, savings numbers, or any customer financial data to the knowledge base. Financial detail goes to Teams only.'
