api_version: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: MonitoringScopeValidation
spec:
  name: MonitoringScopeValidation
  description: Weekly validation that FinOps Hub monitoring covers all active subscriptions
  cron_expression: 0 9 * * 4
  agent_mode: autonomous
  agent: finops-practitioner
  agent_prompt: '# Monitoring Scope Validation


    ## Phase 0: Preparation


    Before starting, read all documents in the knowledge base. Pay special attention to FinOps Hub deployment notes, ADX cluster details, monitored scope decisions, and data freshness workarounds.

    Output style: Apply `ftk-output-style.md` from the knowledge base to every report, Teams message, and Outlook email message. Use its evidence labels, source/derivation rules, exact scope and time-period statements, FinOps capability sections, risk thresholds, confidence/caveat language, and disclaimer requirements.

    Tool routing and delivery guard: This scheduled task is owned by `finops-practitioner`, which has KB-only SearchMemory and no operational tools. Use subagent handoffs for all tool work and pass the full task scope, evidence already collected, open questions, and desired output shape with each handoff. Use `ftk-database-query` for FinOps Hub Kusto, cost, pricing, recommendation, and transaction query tools. Use `azure-capacity-manager` for capacity, quota, capacity reservation group, SKU availability, database service quota, and benefit recommendation Python tools. Use `ftk-hubs-agent` for FinOps Hub infrastructure health, Resource Graph inventory, data freshness, deployment, remediation, alert and budget deployment, and Advisor suppression operations. Use `chief-financial-officer` only for executive finance framing. Use a tool-bearing specialist (`ftk-database-query`, `azure-capacity-manager`, or `ftk-hubs-agent`) for visualization and Teams/Outlook delivery after the final evidence package is assembled. Ask that delivery specialist to check available visualization and delivery tools exactly once per run and remember whether `PostTeamsMessage`, `SendOutlookEmail`, `PlotBarChart`, `PlotPieChart`, `PlotAreaChartWithCorrelation`, and `ExecutePythonCode` are present. Do not call notification, email, connector, Microsoft Graph, `dynamicInvoke`, raw webhook, or connector APIs just to test availability. Use visualization tools first for charts when available, with `ExecutePythonCode` or code-interpreter chart generation only as a fallback. Complete the report before delivery. When a Teams connector/channel is configured, ask the delivery specialist to make one final `PostTeamsMessage` attempt to the configured Teams channel. When an Outlook connector/recipient is configured, ask the delivery specialist to make one final `SendOutlookEmail` attempt with the same final report and any generated chart artifacts. If a configured delivery path fails, mark the task/run failed instead of degrading to local output or probing alternate paths. If neither Teams nor Outlook delivery is configured or available, render the completed report in the run output and explicitly state which delivery paths were skipped.



    Orchestration rule: This scheduled task is owned by `finops-practitioner`. Delegate monitoring-scope and FinOps Hub platform evidence collection to `ftk-hubs-agent`; do not try to run Hub platform tools directly from the practitioner. When the specialist returns evidence, assemble the final FinOps report, apply `ftk-output-style.md`, generate supported visualizations, and deliver the completed output through configured connectors.

    Ask `ftk-hubs-agent` to load its FinOps Hubs guidance and use assigned Hub health tools with the agent system-managed identity where required.


    ## Specialist tools to request from `ftk-hubs-agent`


    Ask `ftk-hubs-agent` to use assigned Hub health tools with their configured authentication and the agent system-managed identity where required.


    - `ftk-hubs-agent`: Run `resource-graph-query` with `query`, optional `subscription_ids` to list active subscriptions and subscription metadata.

    - `data-freshness-check`: Run with `cluster_uri`, optional `database` to validate FinOps Hub function freshness and coverage signals.

    - `ftk-database-query`: Run `percentage-unallocated-costs`, `percentage-untagged-costs`, `tagging-policy-compliance`, and `allocation-accuracy-index` when Kusto is available to validate allocation coverage quality inside the monitored scope.


    ## 1. Establish active subscription inventory


    Ask `ftk-hubs-agent` to run `resource-graph-query` to list active subscriptions and key ownership or environment metadata. Exclude subscriptions documented as intentionally outside the Hub monitoring scope.


    ## 2. Validate Hub data freshness


    Ask `ftk-hubs-agent` to run `data-freshness-check` with `cluster_uri`, optional `database`. Capture latest data dates, staleness days, stale functions, missing functions, and query errors.


    ## 3. Cross-reference monitoring coverage


    Cross-reference Resource Graph subscription inventory with subscriptions represented in Hub data coverage notes or Hub query results. Identify active subscriptions with missing, stale, or ambiguous Hub coverage.

    Ask `ftk-database-query` to run `percentage-unallocated-costs`, `percentage-untagged-costs`, `tagging-policy-compliance`, and `allocation-accuracy-index` for the monitored scope. Use those Allocation KPI results to distinguish "subscription missing from monitoring" from "subscription present but allocation/tagging coverage is weak."


    ## 4. Flag scope gaps


    Flag any active subscription not covered by Hub monitoring, any stale Hub function, and any access or query failure that prevents confidence in coverage. Recommend export, scope, identity, or ingestion remediation.


    ## Report format


    Produce a markdown report with an executive summary, a subscription coverage table, a data freshness table, coverage gaps, errors, and recommended remediation actions.


    ## Persistence


    **Teams and Outlook (results only):** Post the final report to our Teams channel. Do not post intermediate results. Ask the selected delivery specialist to use `PostTeamsMessage` and `SendOutlookEmail` only when the delivery guard found each tool available once per run. If neither Teams nor Outlook delivery is configured or available, return the completed report in the run output with a note naming the skipped delivery paths. If any configured Teams or Outlook final delivery attempt fails, do not retry or probe alternate delivery paths; mark the task/run failed.


    **Knowledge (#remember):** Save operational findings using #remember for future reference. Do not commit task reports, financial figures, cost amounts, or customer financial data to git or the knowledge base. Financial detail goes to configured Teams and Outlook delivery only.


    ## Visualizations


    Before delivery, ask the selected delivery specialist to generate charts for key findings using `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` when those visualization tools fit the data. Use `ExecutePythonCode` or matplotlib/seaborn via the code interpreter only when the visualization tools are unavailable or cannot express the required chart. Include at minimum a monitored versus unmonitored subscription chart and a data staleness chart where the data supports it. Verify each generated chart non-visually before embedding by checking the output file exists, has non-zero size, opens as an image, and reports expected dimensions and metadata through code interpreter filesystem or image-library checks. Do not use visual inspection as the verification gate; regenerate or omit any chart that fails these checks and state why. Embed chart images inline in the Teams message and attach or embed them in the Outlook email alongside the text tables.'

